<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML-STATSSOCCER</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">MS</div>
        <div><strong>ML-STATSSOCCER</strong><span>Web Local</span></div>
      </div>
      <nav>
        <button class="nav-button active" data-view="dashboard">Inicio</button>
        <button class="nav-button" data-view="leagues">Ligas</button>
        <button class="nav-button" data-view="data">Datos</button>
        <button class="nav-button" data-view="models">Modelos</button>
        <button class="nav-button" data-view="evaluate">Evaluar</button>
        <button class="nav-button" data-view="predict">Predecir</button>
        <button class="nav-button" data-view="analysis">Analisis</button>
        <button class="nav-button" data-view="config">Configuracion</button>
      </nav>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div>
          <h1 id="view-title">Inicio</h1>
          <p id="view-meta">http://127.0.0.1:5050</p>
        </div>
        <button id="refresh-btn" class="icon-button" title="Actualizar">A</button>
      </header>

      <section id="alert" class="alert hidden"></section>

      <section id="dashboard" class="view active">
        <div class="metric-grid">
          <div class="metric"><span>Ligas</span><strong id="metric-leagues">0</strong></div>
          <div class="metric"><span>Modelos</span><strong id="metric-models">0</strong></div>
          <div class="metric"><span>Servidor</span><strong>Local</strong></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h2>Proximos 5 partidos</h2></div>
          <div id="dashboard-fixtures" class="output"></div>
          <div id="dashboard-fixture-notes" class="fixture-notes"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><h2>Procesos</h2></div>
          <div id="jobs-list" class="jobs"></div>
        </div>
      </section>

      <section id="leagues" class="view">
        <div class="grid two">
          <form id="league-create-form" class="panel form-panel">
            <div class="panel-header"><h2>Nueva liga</h2></div>
            <div class="catalog-select-row">
              <label>Catalogo<select name="league_index" id="catalog-select"></select></label>
              <div id="catalog-flag" class="catalog-flag"></div>
            </div>
            <div id="catalog-preview" class="catalog-preview"></div>
            <label>ID<input name="league_id" placeholder="epl-2018" required></label>
            <div class="row three">
              <label>Inicio<input name="start_year" type="number" min="2000"></label>
              <label>Historial<input name="history_window" type="number" min="2" max="5" value="3"></label>
              <label>Margen<input name="goal_margin" type="number" min="2" max="5" value="2"></label>
            </div>
            <label>Estadisticas<select name="stats">
              <option value="all">Todas</option>
              <option value="basic">Basicas</option>
              <option value="extended">Extendidas</option>
              <option value="none">Sin estadisticas</option>
            </select></label>
            <div class="row three">
              <label>Odd 1<input name="odd_1" value="all" placeholder="1.30:2.50"></label>
              <label>Odd X<input name="odd_x" value="all" placeholder="2.00:4.00"></label>
              <label>Odd 2<input name="odd_2" value="all" placeholder="1.30:2.50"></label>
            </div>
            <button type="submit" class="primary">+ Crear</button>
          </form>
          <div class="panel">
            <div class="panel-header"><h2>Ligas guardadas</h2></div>
            <div id="saved-leagues"></div>
          </div>
        </div>
      </section>

      <section id="data" class="view">
        <div class="panel">
          <div class="toolbar">
            <select id="data-league"></select>
            <input id="data-query" placeholder="Buscar">
            <input id="data-column" placeholder="Columna">
            <label class="check"><input id="data-missing" type="checkbox"> Sin faltantes</label>
            <button id="data-load">Cargar</button>
            <button id="data-export">CSV</button>
          </div>
          <div id="data-table"></div>
        </div>
      </section>

      <section id="models" class="view">
        <div class="grid two">
          <form id="train-form" class="panel form-panel">
            <div class="panel-header"><h2>Entrenar</h2></div>
            <label>Liga<select name="league_id" id="train-league"></select></label>
            <label>Modelo<select name="model_type" id="model-type"></select></label>
            <label>ID<input name="model_id" placeholder="xgb-result"></label>
            <div class="row three">
              <label>Objetivo<select name="target"><option value="result">Resultado 1/X/2</option><option value="over-under">Over/Under 2.5</option></select></label>
              <label>Normalizador<select name="normalizer"><option>none</option><option>standard</option><option>min-max</option><option>max-abs</option></select></label>
              <label>Muestreo<select name="sampler"><option>none</option><option>svm-smote</option><option>nearmiss</option><option>hardness-threshold</option></select></label>
            </div>
            <div class="row three">
              <label>Eval %<input name="eval_size" type="number" min="5" max="30" value="20"></label>
              <label>N trials<input name="n_trials" type="number" min="1" value="25" data-tuning-control></label>
              <label>Objetivo<select name="objective" data-tuning-control><option>Accuracy</option><option>F1</option><option>Precision</option><option>Recall</option></select></label>
            </div>
            <div class="row three">
              <label class="check"><input name="tuning_enabled" id="tuning-enabled" type="checkbox"> Fine-tuning Optuna</label>
              <label>Algoritmo<select name="optuna_sampler" data-tuning-control><option value="tpe">TPE</option><option value="random">Random</option><option value="cmaes">CMA-ES</option></select></label>
              <label>Pruner<select name="optuna_pruner" data-tuning-control><option value="none">None</option><option value="median">Median</option><option value="successive-halving">Successive Halving</option></select></label>
            </div>
            <div class="row one">
              <label>Parametros<input name="tune_params" id="tune-params" value="all" data-tuning-control></label>
            </div>
            <div class="row two-inline">
              <label class="check"><input name="cv" type="checkbox" checked> Validacion cruzada</label>
              <label class="check"><input name="sliding_cv" type="checkbox" checked> CV deslizante</label>
            </div>
            <button type="submit" class="primary">Entrenar</button>
          </form>
          <div class="panel">
            <div class="toolbar"><select id="models-league"></select><button id="models-load">Cargar</button></div>
            <div id="models-list"></div>
          </div>
        </div>
        <div id="training-progress" class="panel training-progress hidden"></div>
        <div id="training-output" class="panel output"></div>
      </section>

      <section id="evaluate" class="view">
        <form id="evaluate-form" class="panel form-panel">
          <div class="row three">
            <label>Liga<select name="league_id" id="eval-league"></select></label>
            <label>Modelo<select name="model_id" id="eval-model"></select></label>
            <label>Datos<select name="dataset"><option value="eval">Evaluacion</option><option value="all">Todos</option><option value="train">Entrenamiento</option></select></label>
          </div>
          <div class="row five">
            <label>Filtro de odd<input name="odd_filter" value="none" placeholder="1:1.31:1.60"></label>
            <label>P1<input name="p1" type="number" value="0"></label>
            <label>PX<input name="px" type="number" value="0"></label>
            <label>P2<input name="p2" type="number" value="0"></label>
            <label class="check"><input name="store_filter" type="checkbox"> Guardar</label>
          </div>
          <button type="submit" class="primary">Evaluar</button>
        </form>
        <div id="evaluate-output" class="panel output"></div>
      </section>

      <section id="predict" class="view">
        <form id="fixtures-form" class="panel form-panel">
          <div class="panel-header"><h2>Partidos futuros</h2></div>
          <div class="row three">
            <label>Liga<select name="league_id" id="fixtures-league"></select></label>
            <label>Modelo<select name="model_id" id="fixtures-model"></select></label>
            <label>Navegador<select name="application" id="fixtures-browser"><option>chrome</option><option>firefox</option><option>edge</option><option>brave</option></select></label>
          </div>
          <div class="row three">
            <label>Filtros<input name="filters" value="none" placeholder="all, none o filtro"></label>
            <label class="check"><input name="include_all" type="checkbox"> Exportar todo</label>
            <label class="check"><input name="headless" id="fixtures-headless" type="checkbox"> Sin ventana</label>
          </div>
          <div class="actions-row">
            <button id="fixtures-load" type="button">Cargar futuros</button>
            <button type="submit" class="primary">Predecir seleccionados</button>
          </div>
        </form>
        <div class="panel">
          <div class="panel-header"><h2>Seleccionar partidos</h2></div>
          <div id="fixtures-picker" class="output"></div>
        </div>
        <div id="predict-output" class="panel output"></div>
      </section>

      <section id="analysis" class="view">
        <form id="analysis-form" class="panel form-panel">
          <div class="row four">
            <label>Liga<select name="league_id" id="analysis-league"></select></label>
            <label>Tipo<select name="analysis_type">
              <option value="descriptive">Descriptivo</option><option value="distributions">Distribuciones</option><option value="variance">Varianza</option><option value="correlation">Correlacion</option>
              <option value="boruta">Boruta</option><option value="coefficients">Coeficientes</option><option value="impurity">Impureza</option><option value="rules">Reglas</option>
            </select></label>
            <label>Columna<input name="column" value="Result" placeholder="Result"></label>
            <label>Objetivo<select name="target"><option value="result">Resultado 1/X/2</option><option value="over-under">Over/Under 2.5</option></select></label>
          </div>
          <button type="submit" class="primary">Generar</button>
        </form>
        <div id="analysis-output" class="panel output"></div>
      </section>

      <section id="config" class="view">
        <form id="config-form" class="panel form-panel narrow">
          <label>Navegador<select name="application"><option>chrome</option><option>firefox</option><option>edge</option><option>brave</option></select></label>
          <label>Ruta de Brave<input name="brave_binary" placeholder="/usr/bin/brave-browser"></label>
          <label class="check"><input name="headless" type="checkbox"> Sin ventana</label>
          <button type="submit" class="primary">Guardar</button>
        </form>
      </section>
    </main>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
